name: Documentation Tests

on:
  push:
    branches: [master, examples]
  pull_request:
    branches: [master, examples, 'feature/**']

permissions:
  contents: read

# Fork pull requests and Dependabot runs do not receive the Tracebit secret.
env:
  TRACEBIT_ENABLED: ${{ secrets.SECURITY_API_TOKEN != '' }}

jobs:
  doctests:
    name: doctests
    runs-on: ubuntu-latest

    services:
      redis-stack:
        image: redislabs/client-libs-test:8.12.0
        env:
          TLS_ENABLED: no
          REDIS_CLUSTER: no
          PORT: 6379
        ports:
          - 6379:6379

    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26"]

    steps:
      - name: Configure credentials
        if: env.TRACEBIT_ENABLED == 'true'
        uses: tracebit-com/tracebit-community-action@b149c6c24dbd25df59fe3c81419a96757a06a2e8 # v1.4.0
        with:
          customer-id: sha5oz2y
          api-token: ${{ secrets.SECURITY_API_TOKEN }}
          profile: administrator
          profile-region: us-east-1
          async: true
      - name: Set up ${{ matrix.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Test doc examples
        working-directory: ./doctests
        run: make test
